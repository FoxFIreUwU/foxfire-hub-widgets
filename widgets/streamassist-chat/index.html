<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Чат StreamAssist — FoxFire Hub</title>
<style>
  /* Классы страницы начинаются с "sahub-", сам виджет рисует wchat.js (классы "sachat-…"),
     поэтому со стилями FoxFire Hub и других виджетов ничего не пересекается (SYSTEM_WIDGET_STYLE.md, раздел 6). */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* прозрачный фон — OBS покажет только сам чат; в окне Hub (кнопка «Запустить») фон нужен, иначе его не видно */
  body.sahub-window { background: #0b0b10; }
  #sahub-stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #sahub-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%; text-align: center;
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif; color: #b9b4c8; display: none; padding: 12px 16px; }
  #sahub-bar { position: absolute; top: 8px; right: 10px; display: none; gap: 6px; font: 11px/1 system-ui, "Segoe UI", sans-serif; z-index: 5; }
  body.sahub-window #sahub-bar { display: flex; }
  .sahub-pill { display: none; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 12px; color: #c9c9d6;
    background: rgba(0, 0, 0, .55); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sahub-pill.on { display: inline-flex; }
  .sahub-dot { width: 7px; height: 7px; border-radius: 50%; background: #5a5148; flex: none; }
  .sahub-dot.connected { background: #22c55e; } .sahub-dot.connecting { background: #eab308; } .sahub-dot.error { background: #ef4444; }
</style>
</head>
<body>
  <div id="sahub-stage"></div>
  <div id="sahub-bar">
    <span class="sahub-pill" id="sahub-p-twitch"><i class="sahub-dot"></i><span>Twitch</span></span>
    <span class="sahub-pill" id="sahub-p-youtube"><i class="sahub-dot"></i><span>YouTube</span></span>
  </div>
  <div id="sahub-hint"></div>

<script>
/* foxfirehub-bridge.js — общий помощник для виджетов FoxFire Hub (v1)
 *
 * Просто скопируй этот файл в папку своего виджета (рядом с index.html и/или
 * settings.html) и подключи тегом:
 *   <script src="foxfirehub-bridge.js"><\/script>
 *
 * Даёт объект window.FoxFireBridge с несколькими независимыми функциями —
 * ничего не обязательно использовать целиком, бери только то, что нужно.
 * Ничего не ломает, если файл вообще не подключать: это просто обёртка над
 * тем же самым публичным контрактом (query-параметры, postMessage, Tauri-
 * событие), который и так можно реализовать вручную — см. SYSTEM_WIDGET_STYLE.md,
 * раздел 11, если хочешь понимать, что происходит "под капотом".
 *
 * Полностью самостоятельный файл: без зависимостей, без сборки, обычный
 * vanilla JS, работает и в index.html (окно виджета/оверлей OBS), и в
 * settings.html (встроенная страница настроек).
 */
(function (global) {
  "use strict";

  function readBool(v, fallback) {
    if (v === undefined || v === null) return fallback;
    return v === true || v === "true";
  }
  function readNum(v, fallback) {
    var n = Number.parseFloat(v);
    return Number.isFinite(n) ? n : fallback;
  }

  /**
   * Читает текущие query-параметры страницы в объект, типизируя каждое поле
   * по типу значения в defaults (boolean/number/string) — так же, как уже
   * делает и index.html, и settings.html вручную, только в одном месте.
   *
   *   const config = FoxFireBridge.getInitialConfig(DEFAULTS);
   */
  function getInitialConfig(defaults) {
    var params = new global.URLSearchParams(global.location.search);
    var cfg = {};
    Object.keys(defaults || {}).forEach(function (key) {
      cfg[key] = defaults[key];
      if (!params.has(key)) return;
      var raw = params.get(key);
      if (typeof defaults[key] === "boolean") cfg[key] = readBool(raw, defaults[key]);
      else if (typeof defaults[key] === "number") cfg[key] = readNum(raw, defaults[key]);
      else cfg[key] = raw;
    });
    return cfg;
  }

  // Запущена ли страница внутри FoxFire Hub вообще (окно виджета, открытое
  // кнопкой "Запустить", ИЛИ встроенная страница настроек) — по наличию
  // window.__TAURI__ (см. withGlobalTauri в tauri.conf.json самого Hub).
  // Как обычный файл (например, вставленный ссылкой в источник "Браузер" в
  // OBS) — window.__TAURI__ не существует.
  function hasTauri() {
    // Tauri v1: __TAURI__.tauri; Tauri v2: __TAURI__.core (или __TAURI_INTERNALS__).
    return !!(global.__TAURI__ && global.__TAURI__.event && (global.__TAURI__.tauri || global.__TAURI__.core)) || !!global.__TAURI_INTERNALS__;
  }

  // Встроена ли именно ЭТА страница как <iframe> внутрь окна Hub (так
  // открывается settingsEntry во вкладке "Загруженное") — отличается от
  // hasTauri(): окно виджета (index.html), запущенное кнопкой "Запустить",
  // тоже работает внутри Hub и видит window.__TAURI__, но оно НЕ встроено в
  // родительский документ как iframe, у него нет своего "родителя" в этом
  // смысле — isEmbeddedInHub() для него вернёт false, а hasTauri() — true.
  function isEmbeddedInHub() {
    try {
      return !!(global.parent && global.parent !== global);
    } catch (e) {
      return false;
    }
  }

  var CONFIG_UPDATE_EVENT = "foxfirehub:config-updated"; // Tauri-событие, Hub -> уже открытое окно виджета
  var SAVE_MESSAGE_TYPE = "foxfirehub:settings-saved"; // postMessage, встроенная страница настроек -> Hub

  /**
   * Сохраняет (или обновляет частично) настройки в Hub — работает только
   * если страница открыта как settingsEntry внутри вкладки "Загруженное"
   * (см. isEmbeddedInHub). Можно слать весь конфиг целиком или только
   * изменившиеся поля — Hub накладывает присланное поверх уже сохранённого.
   * Возвращает true, если сообщение реально было кому отправить.
   *
   *   FoxFireBridge.saveConfig("my-widget-id", { textColor: "#fff" });
   */
  function saveConfig(widgetId, config) {
    if (!isEmbeddedInHub()) return false;
    global.parent.postMessage({ type: SAVE_MESSAGE_TYPE, widgetId: widgetId, config: config }, "*");
    return true;
  }

  /**
   * Подписка на ЖИВЫЕ изменения настроек — для окна виджета (index.html),
   * уже запущенного кнопкой "Запустить", когда пользователь параллельно
   * меняет настройки в другом месте (вкладка "Загруженное", открытая
   * одновременно). Без этого окно подхватило бы новые значения только на
   * следующий перезапуск — начальный конфиг читается из query-параметров
   * один раз, при создании окна.
   *
   * callback вызывается по одному изменённому полю за раз:
   *   const stop = FoxFireBridge.onLiveConfigUpdate("my-widget-id", ({ key, value }) => {
   *     config[key] = value;
   *     applyConfig(config); // сам решаешь, что делать с изменением
   *   });
   *   // stop() — отписаться, если понадобится
   *
   * Работает только внутри FoxFire Hub (нужен window.__TAURI__) — вне Hub
   * (файл открыт отдельно, как в источнике "Браузер" OBS) просто ничего не
   * делает, это нормальный случай, а не ошибка.
   */
  function onLiveConfigUpdate(widgetId, callback) {
    if (!hasTauri() || typeof callback !== "function") {
      return function unsubscribe() {};
    }
    var unlisten = null;
    var stopped = false;
    global.__TAURI__.event
      .listen(CONFIG_UPDATE_EVENT, function (event) {
        var payload = event && event.payload;
        if (!payload || payload.widgetId !== widgetId) return;
        callback({ key: payload.key, value: payload.value });
      })
      .then(function (fn) {
        if (stopped) fn();
        else unlisten = fn;
      })
      .catch(function (err) {
        console.warn("FoxFireBridge: не удалось подписаться на живые обновления настроек", err);
      });
    return function unsubscribe() {
      stopped = true;
      if (unlisten) unlisten();
    };
  }

  /**
   * Необязательный снимок текущей темы Hub (акцентный цвет пользователя,
   * скругление, масштаб текста, светлая/тёмная/системная) — Hub кладёт его
   * сам в query-параметр __hubTheme, когда открывает settingsEntry или
   * запускает окно виджета (см. utils/appearance.ts → themeBridgeSnapshot в
   * самом Hub). Использовать не обязательно — просто способ подхватить
   * личный акцент пользователя вместо жёстко зашитого цвета, если у виджета
   * нет своей фиксированной фирменной палитры.
   *
   *   const theme = FoxFireBridge.getHubTheme();
   *   // { accent: "#e2820a", accentDark: "#ba6c08", radius: "16px", textScale: "100%", mode: "system" }
   */
  function getHubTheme() {
    var params = new global.URLSearchParams(global.location.search);
    var raw = params.get("__hubTheme");
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  /**
   * Кладёт тему Hub (см. getHubTheme) как CSS-переменные на :root:
   * --hub-accent, --hub-accent-dark, --hub-radius, --hub-text-scale, плюс
   * атрибут data-hub-theme="dark|light|system". В своём CSS используй их
   * через var(--hub-accent, #свой-цвет-по-умолчанию) — тогда всё продолжит
   * работать даже если тема недоступна (страница открыта не из Hub, или из
   * старой версии Hub, которая ещё не шлёт __hubTheme).
   * Возвращает true, если тема была и переменные выставлены.
   */
  function applyHubTheme(theme) {
    theme = theme || getHubTheme();
    if (!theme) return false;
    var root = global.document.documentElement.style;
    if (theme.accent) root.setProperty("--hub-accent", theme.accent);
    if (theme.accentDark) root.setProperty("--hub-accent-dark", theme.accentDark);
    if (theme.radius) root.setProperty("--hub-radius", theme.radius);
    if (theme.textScale) root.setProperty("--hub-text-scale", theme.textScale);
    if (theme.mode) global.document.documentElement.setAttribute("data-hub-theme", theme.mode);
    return true;
  }

  global.FoxFireBridge = {
    getInitialConfig: getInitialConfig,
    hasTauri: hasTauri,
    isEmbeddedInHub: isEmbeddedInHub,
    saveConfig: saveConfig,
    onLiveConfigUpdate: onLiveConfigUpdate,
    getHubTheme: getHubTheme,
    applyHubTheme: applyHubTheme
  };
})(window);
</script>
<script>
/* wstyle.js — ОБЩИЙ ФОРМАТ СТИЛЯ ВИДЖЕТОВ (SAW, версия 1).
   Один и тот же файл работает и в окне программы (предпросмотр, панель настроек),
   и в оверлее для OBS. Здесь нет ни Tauri, ни сети, ни обращений к странице:
   только описание настроек (схема), проверка значений и перенос стиля в JSON.

   Как устроен формат (подробно — docs/WIDGET_FORMAT.md):
     • Виджет описывается СХЕМОЙ: список разделов, в каждом — поля (число, цвет, список…).
       Каждый раздел лежит либо в группе «Общие» (lvl 'g'), либо в «Расширенные» (lvl 'a').
     • Значения виджета — плоский объект { ключ: значение }. Хранятся только отличия от
       значений по умолчанию, поэтому старые сохранения не ломаются при добавлении полей.
     • clean() приводит любые чужие значения к безопасным: число — в пределах min…max,
       цвет — только #RRGGBB, список — только из разрешённых вариантов, текст — без
       управляющих символов. Так импортированный пресет не может внести чужой CSS.
     • Виджет = { id, name, v, schema, presets, ... } регистрируется через SAW.register().
   Общие «кирпичики» (SAW.blocks) — одинаковые разделы для всех виджетов: блок-подложка
   (заливка, рамка, углы, тень, отступы), текст, значок/аватар. Новый виджет берёт их готовыми. */
(function (root) {
  'use strict';

  var FORMAT = 'sa-widget-style';
  var VERSION = 1;
  var HEX6 = /^#[0-9a-fA-F]{6}$/;
  var widgets = {}, kinds = {};

  // ——— Поля ———————————————————————————————————————————————————————————————
  // Каждое поле: { key, label, type: num|color|select|bool|text, def, ... , when(values) }
  function num(key, label, def, min, max, o) {
    o = o || {};
    return { key: key, label: label, type: 'num', def: def, min: min, max: max,
      step: o.step || 1, unit: o.unit || '', hint: o.hint || '', when: o.when || null };
  }
  function color(key, label, def, o) {
    o = o || {};
    return { key: key, label: label, type: 'color', def: def, hint: o.hint || '', when: o.when || null };
  }
  function select(key, label, def, options, o) {
    o = o || {};
    return { key: key, label: label, type: 'select', def: def, options: options, hint: o.hint || '', when: o.when || null };
  }
  function bool(key, label, def, o) {
    o = o || {};
    return { key: key, label: label, type: 'bool', def: !!def, hint: o.hint || '', when: o.when || null };
  }
  function text(key, label, def, o) {
    o = o || {};
    return { key: key, label: label, type: 'text', def: def, max: o.max || 200, multi: !!o.multi,
      hint: o.hint || '', when: o.when || null };
  }
  function section(lvl, id, title, fields, o) {
    return { lvl: lvl, id: id, title: title, fields: fields, hint: (o && o.hint) || '', closed: !!(o && o.closed) };
  }

  // ——— Работа со схемой ———————————————————————————————————————————————————
  function allFields(schema) {
    var out = [];
    schema.sections.forEach(function (s) { s.fields.forEach(function (f) { out.push(f); }); });
    return out;
  }
  function defaults(schema) {
    var d = {};
    allFields(schema).forEach(function (f) { d[f.key] = f.def; });
    return d;
  }
  function cleanText(s, max) {
    // без управляющих символов; < и > тоже убираем — в разметку этот текст не попадает,
    // но так проще убедиться, что он безопасен везде
    return String(s).replace(/[\u0000-\u001f\u007f<>]/g, '').slice(0, max);
  }
  function cleanOne(f, raw) {
    if (raw === undefined || raw === null) return f.def;
    switch (f.type) {
      case 'num': {
        var n = typeof raw === 'number' ? raw : parseFloat(raw);
        if (!isFinite(n)) return f.def;
        n = Math.min(f.max, Math.max(f.min, n));
        var st = f.step < 1 ? 1 / f.step : 1;      // шаг 0.1 → округляем до десятых
        return Math.round(n * st) / st;
      }
      case 'color': return typeof raw === 'string' && HEX6.test(raw) ? raw.toLowerCase() : f.def;
      case 'bool': return raw === true || raw === 1 || raw === '1' || raw === 'true';
      case 'select': {
        var ok = f.options.some(function (o) { return o[0] === raw; });
        return ok ? raw : f.def;
      }
      case 'text': return typeof raw === 'string' ? cleanText(raw, f.max) : f.def;
    }
    return f.def;
  }
  // Полный набор значений: всё, чего нет или что испорчено, берётся по умолчанию.
  function clean(schema, raw) {
    var out = {};
    raw = raw && typeof raw === 'object' ? raw : {};
    allFields(schema).forEach(function (f) { out[f.key] = cleanOne(f, raw[f.key]); });
    return out;
  }
  // Только отличия от умолчаний — именно это хранится и переносится.
  function diff(schema, values) {
    var out = {};
    allFields(schema).forEach(function (f) {
      var v = values[f.key];
      if (v !== undefined && v !== f.def) out[f.key] = v;
    });
    return out;
  }
  function fieldVisible(f, values) {
    try { return !f.when || !!f.when(values); } catch (e) { return true; }
  }

  // ——— Перенос стиля (JSON) ———————————————————————————————————————————————
  function exportDoc(id, schema, values) {
    return { format: FORMAT, v: VERSION, widget: id, values: diff(schema, clean(schema, values)) };
  }
  // Возвращает { ok:true, values } или { ok:false, error } (текст ошибки — для пользователя).
  function importDoc(id, schema, textOrObj) {
    var doc = textOrObj;
    if (typeof textOrObj === 'string') {
      if (textOrObj.length > 200000) return { ok: false, error: 'Текст слишком большой для стиля' };
      try { doc = JSON.parse(textOrObj); } catch (e) { return { ok: false, error: 'Это не JSON: проверьте, что скопирован весь текст стиля' }; }
    }
    if (!doc || typeof doc !== 'object' || doc.format !== FORMAT) return { ok: false, error: 'Это не стиль виджета StreamAssist' };
    if (doc.widget !== id) return { ok: false, error: 'Этот стиль сделан для другого виджета («' + cleanText(doc.widget, 40) + '»)' };
    if (typeof doc.v !== 'number' || doc.v > VERSION) return { ok: false, error: 'Стиль сделан в более новой версии программы' };
    return { ok: true, values: diff(schema, clean(schema, doc.values)) };
  }

  // ——— Цвета и числа для CSS ——————————————————————————————————————————————
  function rgba(hex, alphaPct) {
    var h = HEX6.test(hex) ? hex : '#000000';
    var a = Math.min(100, Math.max(0, +alphaPct));
    if (!isFinite(a)) a = 100;
    return 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' +
      parseInt(h.slice(5, 7), 16) + ',' + (Math.round(a * 10) / 1000) + ')';
  }
  // Безопасное имя шрифта из свободного поля: буквы, цифры, пробел, дефис.
  function fontName(s) {
    var n = String(s || '').replace(/[^\p{L}\p{N} \-]/gu, '').trim().slice(0, 60);
    return n;
  }

  // ——— Общие разделы-«кирпичики» ——————————————————————————————————————————
  // p — префикс ключей, чтобы у разных частей одного виджета не было совпадений.
  var blocks = {
    // Подложка: заливка, рамка, углы, тень, внутренняя подсветка, отступы, размытие.
    box: function (p, d) {
      d = d || {};
      return [
        section('a', p + 'Fill', 'Заливка', [
          select(p + 'FillType', 'Тип заливки', d.fillType || 'solid', [['solid', 'Цвет'], ['gradient', 'Градиент'], ['none', 'Без заливки']]),
          color(p + 'Fill', 'Цвет', d.fill || '#0b0b10'),
          color(p + 'Fill2', 'Второй цвет градиента', d.fill2 || '#1d4fd8', { when: function (v) { return v[p + 'FillType'] === 'gradient'; } }),
          num(p + 'Angle', 'Угол градиента', d.angle === undefined ? 90 : d.angle, 0, 360, { unit: '°', when: function (v) { return v[p + 'FillType'] === 'gradient'; } }),
          num(p + 'FillOp', 'Непрозрачность', d.fillOp === undefined ? 85 : d.fillOp, 0, 100, { unit: '%' })
        ]),
        section('a', p + 'Border', 'Рамка', [
          num(p + 'Bw', 'Толщина', d.bw || 0, 0, 16, { unit: 'px', step: 0.5 }),
          color(p + 'Bc', 'Цвет', d.bc || '#ffffff'),
          num(p + 'Bop', 'Непрозрачность', d.bop === undefined ? 30 : d.bop, 0, 100, { unit: '%' }),
          select(p + 'Bs', 'Линия', d.bs || 'solid', [['solid', 'Сплошная'], ['dashed', 'Штрихи'], ['dotted', 'Точки'], ['double', 'Двойная (от 3 px)']])
        ]),
        section('a', p + 'Corners', 'Углы', [
          bool(p + 'REach', 'Каждый угол отдельно', !!d.rEach),
          num(p + 'R', 'Скругление', d.r === undefined ? 16 : d.r, 0, 120, { unit: 'px', when: function (v) { return !v[p + 'REach']; } }),
          num(p + 'Rtl', 'Левый верхний', d.r === undefined ? 16 : d.r, 0, 120, { unit: 'px', when: function (v) { return !!v[p + 'REach']; } }),
          num(p + 'Rtr', 'Правый верхний', d.r === undefined ? 16 : d.r, 0, 120, { unit: 'px', when: function (v) { return !!v[p + 'REach']; } }),
          num(p + 'Rbr', 'Правый нижний', d.r === undefined ? 16 : d.r, 0, 120, { unit: 'px', when: function (v) { return !!v[p + 'REach']; } }),
          num(p + 'Rbl', 'Левый нижний', d.r === undefined ? 16 : d.r, 0, 120, { unit: 'px', when: function (v) { return !!v[p + 'REach']; } })
        ]),
        section('a', p + 'Shadow', 'Тень', [
          bool(p + 'ShOn', 'Включить тень', !!d.shOn),
          num(p + 'ShX', 'Сдвиг по горизонтали', 0, -60, 60, { unit: 'px', when: function (v) { return !!v[p + 'ShOn']; } }),

      emotesLoading = true;
      loadGlobalEmotes(env).then(function (all) { third.setAll(all); emotesLoaded = true; }, function () { /* без сторонних эмоутов */ })
        .then(function () { emotesLoading = false; });
    }

    // ——— Twitch ———
    function startTwitch(channel) {
      var stopped = false, ws = null, delay = 1000, lastData = 0, watchdog = 0;
      function connect() {
        if (stopped || dead) return;
        status('twitch', 'connecting', 'подключение к #' + channel + '…');
        try { ws = new env.WebSocket(TWITCH_WS); } catch (e) {
          status('twitch', 'error', 'не удалось открыть соединение с Twitch');
          later(connect, delay = Math.min(delay * 2, 30000));
          return;
        }
        var mine = ws;
        mine.onopen = function () {
          lastData = env.now();
          mine.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
          mine.send('PASS SCHMOOPIIE');
          mine.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
          mine.send('JOIN #' + channel);
        };
        mine.onmessage = function (ev) {
          lastData = env.now();
          String(ev.data).split('\r\n').forEach(function (line) {
            if (!line) return;
            var r = parseLine(line, third, env.now);
            if (r.t === 'ping') mine.send('PONG ' + r.payload);
            else if (r.t === 'joined') { delay = 1000; status('twitch', 'connected', '#' + channel); }
            else if (r.t === 'notice') status('twitch', 'error', r.text || 'сообщение от Twitch');
            else if (r.t === 'reconnect') { try { mine.close(); } catch (e) { /* уже закрыт */ } }
            else if (r.t === 'chat') deliver(r.msg);
          });
        };
        mine.onclose = function () {
          if (stopped || ws !== mine) return;
          status('twitch', 'connecting', 'переподключение…');
          later(connect, delay);
          delay = Math.min(delay * 2, 30000);
        };
        mine.onerror = function () {
          status('twitch', 'error', 'нет связи с чатом Twitch (проверьте интернет и файрвол)');
          try { mine.close(); } catch (e) { /* уже закрыт */ }
        };
      }
      watchdog = setInterval(function () {
        if (ws && lastData && env.now() - lastData > STALE_MS) { lastData = env.now(); try { ws.close(); } catch (e) { /* уже закрыт */ } }
      }, 60000);
      connect();
      return function stop() {
        stopped = true; clearInterval(watchdog);
        var w = ws; ws = null;
        if (w) { w.onclose = w.onerror = w.onmessage = null; try { w.close(); } catch (e) { /* уже закрыт */ } }
        status('twitch', 'idle', '');
      };
    }

    // ——— YouTube без ключа (через Hub) ———
    function runKeyless(c, transport, ref, giveUp) {
      var since = 0, fails = 0;
      function tick() {
        if (ref.stopped) return;
        var wait = 1500;
        Promise.resolve().then(function () {
          return transport.poll({ channel: c.youtubeChannel, video: normVideoId(c.youtubeVideoIdOverride), since: since });
        }).then(function (r) {
          if (ref.stopped) return;
          r = r || {};
          fails = 0;
          if (typeof r.next === 'number') since = r.next;
          if (r.state === 'connected') status('youtube', 'connected', r.message || '');
          else if (r.state === 'error') { status('youtube', 'error', r.message || 'ошибка чтения чата'); wait = 5000; }
          else if (r.state === 'offline') { status('youtube', 'idle', r.message || 'эфира сейчас нет, жду…'); wait = 4000; }
          else { status('youtube', 'connecting', r.message || 'ищу трансляцию…'); wait = 2500; }
          (Array.isArray(r.messages) ? r.messages : []).forEach(function (m) { deliver(fromYtPoll(m)); });
        }, function (err) {
          if (ref.stopped) return;
          fails++;
          status('youtube', 'error', 'нет связи с Hub: ' + (err && err.message ? err.message : err));
          wait = 5000;
          if (fails >= 5 && c.youtubeApiKey) { giveUp(); wait = -1; }
        }).then(function () { if (!ref.stopped && wait >= 0) later(tick, wait); });
      }
      tick();
    }

    // ——— YouTube по официальному API-ключу ———
    function apiJson(url) {
      return env.fetchTimeout(url, 10000).then(function (res) { return res.json().then(function (d) { return { status: res.status, data: d }; }); });
    }
    function runApi(c, ref) {
      var inv = env.tauriInvoke && env.tauriInvoke();
      var chanCache = null;
      function resolveChannelId() {
        if (chanCache) return Promise.resolve(chanCache);
        var h = c.youtubeChannel.trim(), m = /youtube\.com\/([^/?#]+)/.exec(h);
        if (m) h = m[1];
        var q = /^UC[\w-]{20,}$/.test(h) ? 'id=' + encodeURIComponent(h) : 'forHandle=' + encodeURIComponent(h[0] === '@' ? h : '@' + h);
        return apiJson('https://www.googleapis.com/youtube/v3/channels?part=id&' + q + '&key=' + encodeURIComponent(c.youtubeApiKey)).then(function (r) {
          if (r.data.error) throw new Error(r.data.error.message || 'ошибка YouTube API');
          chanCache = r.data.items && r.data.items[0] && r.data.items[0].id || null;
          return chanCache;
        });
      }
      function findVideo() {
        var ov = normVideoId(c.youtubeVideoIdOverride);
        if (ov) return Promise.resolve(ov);
        if (inv) return Promise.resolve(inv('resolve_youtube_live_video', { channel: c.youtubeChannel })).catch(function () { return null; });
        return resolveChannelId().then(function (id) {
          if (!id) return null;
          return apiJson('https://www.googleapis.com/youtube/v3/search?part=id&channelId=' + encodeURIComponent(id) + '&eventType=live&type=video&key=' + encodeURIComponent(c.youtubeApiKey))
            .then(function (r) { return r.data.error ? null : (r.data.items && r.data.items[0] && r.data.items[0].id && r.data.items[0].id.videoId) || null; });
        });
      }
      var retryIdle = inv ? 20000 : 5 * 60 * 1000;   // через Hub поиск бесплатный, через API — берегём квоту
      function loop() {
        if (ref.stopped) return;
        status('youtube', 'connecting', 'ищу трансляцию…');
        findVideo().then(function (video) {
          if (ref.stopped) return;
          if (!video) { status('youtube', 'idle', 'эфира сейчас нет, жду…'); later(loop, retryIdle); return; }
          return apiJson('https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=' + encodeURIComponent(video) + '&key=' + encodeURIComponent(c.youtubeApiKey)).then(function (r) {
            if (ref.stopped) return;
            if (r.data.error) throw new Error(r.data.error.message || 'ошибка YouTube API');
            var it = r.data.items && r.data.items[0];
            var chatId = it && it.liveStreamingDetails && it.liveStreamingDetails.activeLiveChatId;
            if (!chatId) { status('youtube', 'idle', 'у трансляции нет активного чата'); later(loop, retryIdle); return; }
            status('youtube', 'connected', 'API-ключ');
            poll(chatId, undefined);
          });
        }).catch(function (e) {
          if (ref.stopped) return;
          status('youtube', 'error', (e && e.message) || 'ошибка YouTube');
          later(loop, 20000);
        });
      }
      function poll(chatId, token) {
        if (ref.stopped) return;
        var url = 'https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=' + encodeURIComponent(chatId) +
          '&part=snippet,authorDetails&key=' + encodeURIComponent(c.youtubeApiKey) + (token ? '&pageToken=' + encodeURIComponent(token) : '');
        var wait = 5000;
        apiJson(url).then(function (r) {
          if (ref.stopped) return;
          var d = r.data;
          if (d.error) {
            var reason = d.error.errors && d.error.errors[0] && d.error.errors[0].reason || '';
            if (reason === 'liveChatEnded' || r.status === 403 || r.status === 404) { later(loop, 3000); wait = -1; return; }
            status('youtube', 'error', d.error.message || 'ошибка YouTube API');
            wait = 30000;   // скорее всего квота: чаще раза в 30 с не стучимся
            return;
          }
          (d.items || []).forEach(function (it) { deliver(fromYtApi(it)); });
          token = d.nextPageToken || token;
          wait = Math.max(2000, d.pollingIntervalMillis || 5000);
        }, function () { wait = 15000; }).then(function () { if (!ref.stopped && wait >= 0) later(function () { poll(chatId, token); }, wait); });
      }
      loop();
    }

    function startYoutube(c) {
      var ref = { stopped: false };
      var wantApi = c.youtubeMode === YT_MODE_API;
      var transport = wantApi ? null : keylessTransport(env);
      if (transport) runKeyless(c, transport, ref, function () { runApi(c, ref); });
      else if (!c.youtubeApiKey) {
        status('youtube', 'error', wantApi ? 'не указан API-ключ YouTube'
          : 'без ключа чат YouTube читается только через Hub: откройте виджет по ссылке из Hub (http://127.0.0.1…) или впишите API-ключ');
      } else runApi(c, ref);
      return function stop() { ref.stopped = true; status('youtube', 'idle', ''); };
    }

    return {
      third: third,
      // Применить настройки. Перезапускается только то, что реально изменилось.
      apply: function (rawConn) {
        if (dead) return;
        var c = connFrom(rawConn);
        third.enabled = c.thirdPartyEmotes;
        if (c.thirdPartyEmotes) loadEmotes();

        var tw = normTwitch(c.twitchChannel);
        var twKey = tw || (c.twitchChannel ? '!' + c.twitchChannel : '');
        if ((cur.twitch ? cur.twitch.key : '') !== twKey) {
          if (cur.twitch) cur.twitch.stop();
          cur.twitch = null;
          if (tw) cur.twitch = { key: twKey, stop: startTwitch(tw) };
          else if (c.twitchChannel) { cur.twitch = { key: twKey, stop: function () {} }; status('twitch', 'error', 'это не похоже на логин Twitch'); }
          else status('twitch', 'idle', '');
        }
        var ytOn = !!(c.youtubeChannel || normVideoId(c.youtubeVideoIdOverride));
        var ytKey = ytOn ? JSON.stringify([c.youtubeChannel, c.youtubeMode, c.youtubeApiKey, normVideoId(c.youtubeVideoIdOverride)]) : '';
        if ((cur.youtube ? cur.youtube.key : '') !== ytKey) {
          if (cur.youtube) cur.youtube.stop();
          cur.youtube = null;
          if (ytOn) cur.youtube = { key: ytKey, stop: startYoutube(c) };
          else status('youtube', 'idle', '');
        }
      },
      // Есть ли хоть один источник (для подсказки «Укажите канал»).
      hasSource: function () { return !!(cur.twitch || cur.youtube); },
      stop: function () {
        dead = true;
        timers.forEach(clearTimeout); timers.clear();
        if (cur.twitch) cur.twitch.stop();
        if (cur.youtube) cur.youtube.stop();
        cur.twitch = cur.youtube = null;
      }
    };
  }

  var api = {
    CONN_DEFAULTS: CONN_DEFAULTS, YT_MODE_KEYLESS: YT_MODE_KEYLESS, YT_MODE_API: YT_MODE_API,
    connFrom: connFrom, normTwitch: normTwitch, normVideoId: normVideoId,
    unescapeTag: unescapeTag, parseTags: parseTags, parseBadges: parseBadges, renderParts: renderParts, parseLine: parseLine,
    Emotes: Emotes, parse7tv: parse7tv, parseBttv: parseBttv, loadGlobalEmotes: loadGlobalEmotes,
    fromYtPoll: fromYtPoll, fromYtApi: fromYtApi, createFeed: createFeed, keylessTransport: keylessTransport,
    createConnections: createConnections
  };
  root.SAHub = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
  (function () {
    'use strict';
    // ——— Соседние файлы ———
    // Внутри Hub адрес страницы — asset.localhost/<путь целиком в percent-encoding, где «/» это %2F или %5C>, поэтому обычное
    // <script src="wchat.js"> там НЕ найдётся (так же, как config.js у unified-chat). Режем адрес по последнему разделителю
    // любого вида сами. Все файлы виджета лежат в одной папке — без вложенных папок.
    function siblingUrl(name) {
      var href = location.href.split(/[?#]/)[0], cut = -1, re = /%5C|%2F|\//gi, m;
      while ((m = re.exec(href))) cut = m.index + m[0].length;
      return (cut < 0 ? href + '/' : href.slice(0, cut)) + name;
    }
    function loadScript(name, bust) {
      return new Promise(function (resolve, reject) {
        var el = document.createElement('script'), done = false;
        function finish(ok) { if (done) return; done = true; if (!ok) { el.remove(); reject(new Error(name)); } else resolve(); }
        el.onload = function () { finish(true); };
        el.onerror = function () { finish(false); };
        setTimeout(function () { finish(false); }, 8000);
        el.src = siblingUrl(name) + (bust ? '?t=' + Date.now() : '');
        document.head.appendChild(el);
      });
    }
    function hint(text) {
      var h = document.getElementById('sahub-hint');
      h.textContent = text || ''; h.style.display = text ? 'block' : 'none';
    }
    // config.js пишет Hub при каждом изменении настроек; читаем обычным <script> — так работает и из file:// в OBS.
    function loadConfigFile(bust) {
      return new Promise(function (resolve) {
        try { delete window.__FOXFIRE_WIDGET_CONFIG__; } catch (e) { window.__FOXFIRE_WIDGET_CONFIG__ = undefined; }
        loadScript('config.js', bust).then(function () {
          var v = window.__FOXFIRE_WIDGET_CONFIG__;
          document.querySelectorAll('script[src*="config.js"]').forEach(function (s) { s.remove(); });
          resolve(v && typeof v === 'object' ? v : null);
        }, function () { resolve(null); });
      });
    }

    // Все скрипты вшиты выше (tools/build.py): подгружать соседние файлы нельзя, во вложенных окнах Hub это не работает.
    start();

    function start() {
      var SAW = window.SAW, CHAT = SAW.chat, DEF = SAW.get('chat'), HUB = window.SAHub, BR = window.FoxFireBridge;
      var WIDGET_ID = 'streamassist-chat';
      var params = new URLSearchParams(location.search), query = {};
      params.forEach(function (v, k) { query[k] = v; });

      // Режим: ?view=obs — всегда прозрачный оверлей. Иначе внутри Hub (окно, открытое кнопкой «Запустить») — окно с фоном,
      // а как файл или по ссылке http://127.0.0.1 (OBS, браузер) — прозрачный оверлей.
      var inHubWindow = query.view !== 'obs' && BR.hasTauri() && !BR.isEmbeddedInHub();
      document.body.classList.toggle('sahub-window', inHubWindow);
      var opts = { mode: inHubWindow ? 'app' : 'obs' };   // размытие фона — только в окне Hub: в OBS оно рисует чёрный блок

      var stage = document.getElementById('sahub-stage');
      var raw = Object.assign({}, query);
      var widget = CHAT.create(stage, DEF.migrate(raw), opts);
      var styleKey = '';

      // ——— Статус подключения (виден только в окне Hub) ———
      var pills = { twitch: document.getElementById('sahub-p-twitch'), youtube: document.getElementById('sahub-p-youtube') };
      var NAMES = { twitch: 'Twitch', youtube: 'YouTube' };
      function onStatus(platform, state, text) {
        var p = pills[platform];
        if (!p) return;
        p.classList.toggle('on', state !== 'idle' || !!text);
        p.firstChild.className = 'sahub-dot ' + (state === 'idle' ? '' : state);
        p.lastChild.textContent = NAMES[platform] + (text ? ': ' + text : '');
        p.title = p.lastChild.textContent;
        if (state === 'error') console.warn('streamassist-chat [' + platform + ']: ' + text);
      }

      var conn = HUB.createConnections(null, { onMessage: function (m) { widget.push(m); }, onStatus: onStatus });

      function apply() {
        var vals = DEF.migrate(raw);
        var key = JSON.stringify(SAW.clean(CHAT.schema, vals));
        if (key !== styleKey) { styleKey = key; widget.update(vals, opts); }
        var c = HUB.connFrom(raw);
        conn.apply(c);
        var any = !!(HUB.normTwitch(c.twitchChannel) || c.youtubeChannel || c.youtubeVideoIdOverride);
        hint(any ? '' : 'Укажите канал Twitch и/или YouTube в настройках виджета (FoxFire Hub → «Загруженное»).');
      }
      // Пачка изменений (например, выбор готового стиля — десятки полей сразу) применяется один раз.
      var timer = 0;
      function schedule() { clearTimeout(timer); timer = setTimeout(apply, 60); }

      window.addEventListener('resize', function () { requestAnimationFrame(function () { widget.fit(); }); });

      // ——— Настройки: query-параметры (первый запуск) → config.js (его пишет Hub, ссылка в OBS постоянная) → живые события Hub ———
      var lastFile = '';
      function readFile(first) {
        return loadConfigFile(!first).then(function (file) {
          if (!file) return false;
          var json = JSON.stringify(file);
          if (json === lastFile) return false;
          lastFile = json;
          raw = Object.assign({}, query, file);
          return true;
        });
      }
      readFile(true).then(function () {
        apply();
        setInterval(function () { readFile(false).then(function (changed) { if (changed) schedule(); }); }, 3000);
      });
      // Окно, открытое кнопкой «Запустить», узнаёт о правках сразу (config.js подхватится позже, но без задержки приятнее).
      BR.onLiveConfigUpdate(WIDGET_ID, function (u) { if (u && typeof u.key === 'string') { raw[u.key] = u.value; schedule(); } });
      window.addEventListener('pagehide', function () { conn.stop(); });
    }
  })();
  </script>
